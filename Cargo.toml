[package]
name = "rddbsh"
version = "0.12.2"
edition = "2021"
description = "A SQL-like interactive CLI for Amazon DynamoDB (Rust port of awslabs/dynamodb-shell)"
license = "Apache-2.0"
repository = "https://github.com/winebarrel/rddbsh"
homepage = "https://github.com/winebarrel/rddbsh"
readme = "README.md"

[lib]
name = "rddbsh"
path = "src/lib.rs"

[[bin]]
name = "rddbsh"
path = "src/bin/rddbsh.rs"

[dependencies]
aws-config = { version = "1.13.3", features = ["credentials-login"] }
aws-credential-types = "1.3.1"
aws-sigv4 = "1.6.6"
aws-smithy-runtime-api = "1.22.0"
base64 = "0.23.1"
ctrlc = "3.5.3"
regex = "1.13.2"
rustyline = "19.0.0"
tokio = { version = "1.54.1", features = ["net", "rt", "rt-multi-thread", "time"] }
ureq = "3.5.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
